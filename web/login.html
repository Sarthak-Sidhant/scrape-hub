<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Scrape hub - sign in</title><style>
:root{--bg:#0b0f14;--panel:#111820;--line:#26323f;--text:#d5dde6;--dim:#7d8b99;--accent:#6cb6ff;--bad:#ef6a6a}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--line:#d3dae2;--text:#1d2630;--dim:#66727f;--accent:#1f6fc0;--bad:#cf3f3f}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;width:100%;max-width:340px}
h1{font-size:15px;margin:0 0 4px;letter-spacing:.04em}p{margin:0 0 16px;color:var(--dim);font-size:12px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{margin-top:12px;width:100%;padding:10px;border-radius:8px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--bad);font-size:12px;margin:10px 0 0}</style></head><body>
<form method="post" action="/login"><h1>SCRAPE HUB</h1><p>Enter the password to continue.</p>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Sign in</button>__ERR__</form></body></html>
