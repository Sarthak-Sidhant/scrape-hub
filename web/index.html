<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Scrape hub</title><style>
:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sx:#898781;--st-err:#ec835a;--st-blk:#d03b3b;--bg:#0b0f14;--panel:#111820;--panel2:#16202b;--line:#26323f;--text:#d5dde6;--dim:#7d8b99;--accent:#6cb6ff;--ok:#5fcf8a;--warn:#e8b44c;--bad:#ef6a6a;--bar:#1e2a37}
@media (prefers-color-scheme:light){:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--bg:#f3f5f8;--panel:#fff;--panel2:#f6f8fb;--line:#d3dae2;--text:#1d2630;--dim:#66727f;--accent:#1f6fc0;--ok:#2a9d5c;--warn:#b7791f;--bad:#cf3f3f;--bar:#e6ebf1}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
a{color:var(--accent)}.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:14px;margin:0;letter-spacing:.08em}header .sp{flex:1}
.pill{padding:1px 10px;border-radius:99px;border:1px solid currentColor;font-size:12px;font-weight:600;white-space:nowrap}
.healthy{color:var(--ok)}.degraded{color:var(--warn)}.unhealthy{color:var(--bad)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2s infinite}
.live.off{background:var(--bad);animation:none}@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
main{padding:16px;display:grid;gap:14px;max-width:1280px;margin:0 auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:11px;margin:0 0 10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.15;font-weight:700}.kpi span{color:var(--dim);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;display:flex;margin:10px 0 4px}
.bar i{display:block;height:100%}.done{background:var(--ok)}.claimed{background:var(--accent)}.failed{background:var(--bad)}.pending{background:transparent}
.rules{margin:10px 0 0;padding:0;list-style:none}.rules li{display:flex;gap:8px;padding:1px 0}
.rules li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor}
.rules span{color:var(--text)}
.slices{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tile{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0f14;background:var(--bar)}
.tile.running{background:var(--ok)}.tile.finished{background:var(--accent)}.tile.stalled{background:var(--bad)}.tile.failed{background:var(--bad)}.tile.none{color:var(--dim);border:1px dashed var(--line);background:transparent}
.prog{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}.prog b{font-size:15px}
.bar.big{height:10px}.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.m{border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--panel2);font-size:12px}.m i{font-style:normal;color:var(--dim)}
.tgt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.tgt .err{grid-column:1/-1;color:var(--bad);word-break:break-word}
button.act{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
button.act:hover{border-color:var(--accent)}
.sub{margin-top:10px}.sub summary{cursor:pointer;color:var(--dim);font-size:12px}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:3px 11px;border:0;background:transparent;color:var(--dim);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text);font-weight:700}
.seg button:hover{color:var(--text)}
.chartwrap{position:relative;transition:opacity .15s}.chartwrap.stale{opacity:.45}svg{display:block;width:100%}
svg text{font-family:inherit}
.tip{position:absolute;pointer-events:none;z-index:4;min-width:150px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.22);font-size:12px}
.tip .th{color:var(--dim);margin-bottom:4px}.tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}
.tip .key{flex:none;width:12px;height:3px;border-radius:2px}.tip .tv{font-weight:700;font-size:13px;min-width:40px;text-align:right}.tip .tn{color:var(--dim)}
.tip .sep{border-top:1px solid var(--line);margin:4px 0}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px}
.lg span{display:inline-flex;align-items:center;gap:6px;color:var(--text)}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}.lg em{font-style:normal;color:var(--dim)}
.tblwrap{max-height:300px;overflow:auto}.tblwrap table{margin-top:0}
.tblwrap th{position:sticky;top:0;background:var(--panel)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rn{display:grid;grid-template-columns:78px minmax(0,1.1fr) 56px minmax(0,2fr) 84px 250px 52px;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.rn:first-of-type{border-top:0}
.rn .st{font-weight:600}.rn .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rn .ip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn small{color:var(--dim)}
.rnh{display:grid;grid-template-columns:78px minmax(0,1.1fr) 56px minmax(0,2fr) 84px 250px 52px;gap:12px;color:var(--dim);font-size:11px;padding-bottom:6px}
.rnh .n{text-align:right}
@media (max-width:860px){
 header{gap:8px;padding:10px 12px}header h1{white-space:nowrap}#updated{display:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .rnh{display:none}
 .rn{grid-template-columns:auto 1fr auto;grid-template-areas:"st repo slice" "what what what" "recs ip seen";gap:2px 10px;padding:10px 0}
 .rn>:nth-child(1){grid-area:st}.rn>:nth-child(2){grid-area:repo}.rn>:nth-child(3){grid-area:slice;text-align:right}
 .rn>:nth-child(4){grid-area:what;white-space:normal}.rn>:nth-child(5){grid-area:recs;text-align:left}
 .rn>:nth-child(6){grid-area:ip;color:var(--dim)}.rn>:nth-child(7){grid-area:seen;text-align:right}
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel2)}
.tag{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
details summary{cursor:pointer;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
table{border-collapse:collapse;width:100%;margin-top:8px}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--dim);font-weight:500}
td.n,th.n{text-align:right}.scroll{overflow-x:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<header><h1>SCRAPE HUB</h1><span id="verdict" class="pill dim">loading</span><span class="sp"></span>
<span class="dim"><span id="dot" class="live"></span><span id="updated">connecting</span></span><a href="/logout">sign out</a></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="cards" id="projects"></div>
<section><h2>Records per minute</h2>
<div class="chartbar"><div class="seg" id="ranges" role="group" aria-label="time range"></div>
<div class="seg" id="views" role="group" aria-label="view"><button data-v="chart" aria-pressed="true">Chart</button><button data-v="table" aria-pressed="false">Table</button></div></div>
<div class="chartwrap" id="chart"></div><div class="lg" id="legend"></div></section>
<section><h2>Runners</h2><div class="rnh"><span>state</span><span>repository</span><span class="n">slice</span><span>doing now</span><span class="n">records</span><span>ip (api / reported)</span><span class="n">seen</span></div><div id="runs"></div></section>
<section><h2>Repositories</h2><div class="chips" id="repos"></div></section>
<section><details><summary>Runner IP history, 7 days</summary><div class="scroll"><table id="ips"></table></div></details></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString();
const ago=t=>{if(!t)return"-";const s=Math.max(0,(Date.now()-new Date(t))/1000);
 return s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+"m":s<172800?Math.round(s/3600)+"h":Math.round(s/86400)+"d"};
async function j(u){const r=await fetch(u);if(r.status===401){location="/login";throw 0}if(!r.ok)throw new Error(u);return r.json()}

function kpis(ov){
 const P=ov.projects,sum=f=>P.reduce((a,p)=>a+f(p),0);
 const rate=sum(p=>p.stats.rate_now),run=sum(p=>p.stats.running),stalled=sum(p=>p.stats.stalled),rec=sum(p=>p.records_total);
 let done=0,tot=0;P.forEach(p=>{const q=p.stats.queue||{};Object.values(q).forEach(n=>tot+=n);done+=q.done||0});
 $("kpis").innerHTML=
  `<div class="kpi"><b>${rate.toFixed(0)}</b><span>records / min</span></div>
   <div class="kpi"><b>${run}</b><span>runners active${stalled?` · <span class="bad">${stalled} stalled</span>`:""}</span></div>
   <div class="kpi"><b>${fmt(rec)}</b><span>records stored</span></div>
   <div class="kpi"><b>${tot?Math.round(done/tot*100)+"%":"-"}</b><span>${tot?`${fmt(done)} of ${fmt(tot)} orgs done`:"no queue"}</span></div>`}

function slicesFor(project,runs){
 const mine=runs.filter(r=>r.project===project);if(!mine.length)return"";
 const latest=mine[0],g=mine.filter(r=>r.repository===latest.repository&&r.gh_run_id===latest.gh_run_id&&r.run_attempt===latest.run_attempt);
 const by={};g.forEach(r=>by[r.job_index]=r);
 let t="";for(let i=0;i<Math.min(latest.total_jobs,60);i++){const r=by[i],st=r?(r.stalled?"stalled":r.state):"none";
  t+=`<span class="tile ${st}" title="slice ${i}: ${st}${r?`, ${fmt(r.records)} records`:" (not started)"}">${i}</span>`}
 return `<div class="slices" role="img" aria-label="runner slices for the latest workflow run">${t}</div>`}

const openSet=new Set();
const dur2=sec=>{if(sec==null)return null;const m=Math.round(sec/60);return m<90?m+"m":m<2880?(m/60).toFixed(1)+"h":(m/1440).toFixed(1)+"d"};
const tname=t=>t.payload&&(t.payload.org_name||t.payload.name)||t.key;
function metricChips(ms){
 const by={};ms.forEach(m=>by[m.name]=m);const used=new Set(),out=[];
 ms.forEach(m=>{if(m.name.endsWith("_ok")){const base=m.name.slice(0,-3),f=by[base+"_fail"];
   if(f){used.add(m.name);used.add(base+"_fail");const ok=m.hour,tot=ok+f.hour,r5=(m.last5||0),t5=r5+(f.last5||0);
    out.push(`<span class="m" title="${fmt(ok)} ok / ${fmt(f.hour)} failed in the last hour">${esc(base)} <b class="${ok/tot<.5?"warn":"ok"}">${Math.round(ok/tot*100)}%</b> <i>ok${t5?` · ${Math.round(r5/t5*100)}% last 5m`:""}</i></span>`)}}});
 ms.filter(m=>!used.has(m.name)).forEach(m=>out.push(`<span class="m">${esc(m.name)} <b>${fmt(m.hour)}</b> <i>1h</i></span>`));
 return out.length?`<div class="metrics">${out.join("")}</div>`:""}

function projectCard(p,runs,d){
 const q=p.stats.queue||{},tot=Object.values(q).reduce((a,b)=>a+b,0),ul=p.unit_label,rl=p.record_label;
 const exp=p.expected_records,have=p.records_total,pct=exp?Math.min(100,have/exp*100):null;
 const eta=p.eta_s!=null?"ETA "+dur2(p.eta_s):(p.stats.running?"ETA unknown":"idle");
 const bar=tot?`<div class="bar big" role="img" aria-label="${ul} progress">${["done","claimed","failed"].map(k=>`<i class="${k}" style="width:${(q[k]||0)/tot*100}%"></i>`).join("")}</div>
  <div class="dim">${fmt(q.done||0)} ${ul}s done · ${fmt(q.claimed||0)} in flight · ${fmt(q.failed||0)} failed · ${fmt(q.pending||0)} waiting</div>`:"";
 const prog=`<div class="prog"><span><b>${fmt(have)}</b>${exp?` of ~${fmt(exp)}`:""} ${esc(rl)}s${pct!=null?` <span class="dim">(${pct.toFixed(1)}%)</span>`:""}</span><span><b>${p.stats.rate_now.toFixed(0)}</b>/min · ${eta}</span></div>`;
 let tail="";
 if(d){
  const id=p.project,failed=d.failed||[],infl=d.inflight||[];
  const fl=failed.length?`<details class="sub" data-k="f-${id}" ${openSet.has("f-"+id)?"open":""}><summary class="bad">${failed.length} failed ${ul}${failed.length>1?"s":""}</summary>
    <div style="margin:6px 0"><button class="act" data-retry="${esc(id)}">Retry all failed</button></div>
    ${failed.map(t=>`<div class="tgt"><span>${esc(tname(t))} <span class="dim">· ${t.attempts} attempt${t.attempts==1?"":"s"}</span></span><span class="dim">expected ${fmt(t.payload.expected||0)}</span>${t.last_error?`<span class="err">${esc(t.last_error)}</span>`:""}</div>`).join("")}</details>`:"";
  const il=infl.length?`<details class="sub" data-k="i-${id}" ${openSet.has("i-"+id)?"open":""}><summary>${infl.length} ${ul}${infl.length>1?"s":""} in flight</summary>
    ${infl.map(t=>`<div class="tgt"><span>${esc(tname(t))}</span><span class="dim">slice ${t.job_index??"?"} · ${ago(t.claimed_at)}</span></div>`).join("")}</details>`:"";
  const fresh=d.newest_record?`<div class="dim" style="margin-top:8px">newest ${esc(rl)} stored ${ago(d.newest_record)} ago</div>`:"";
  tail=metricChips(d.metrics||[])+fl+il+fresh}
 return `<section><div class="row"><h2 style="margin:0">${esc(p.title)}</h2><span class="pill ${p.verdict}">${p.verdict}</span></div>
 ${prog}${bar}${slicesFor(p.project,runs)}
 <ul class="rules">${p.rules.map(r=>`<li class="${r.level}"><span>${esc(r.message)}</span></li>`).join("")}</ul>${tail}</section>`}

const RANGES={"15m":{min:15,bucket:1},"1h":{min:60,bucket:1},"6h":{min:360,bucket:5},"24h":{min:1440,bucket:15}};
let range="1h",cview="chart",chartCache=null,hoverI=null;
const SERIES_VARS=["--s1","--s2","--s3","--s4","--s5","--s6"];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const compact=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+"M":v>=1e3?(v/1e3).toFixed(v%1e3?1:0)+"K":String(Math.round(v*10)/10);
const clock=t=>new Date(t*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});

function buildChart(points,bucket,projects){
 const r=RANGES[range],b=bucket*60,end=Math.floor(Date.now()/1000/b)*b,n=Math.round(r.min/bucket);
 // Colour follows the project (creation order), never its rank in this window; the tail past 6 folds into "other".
 const names=projects.map(p=>p.project),series=names.slice(0,6).map((nm,i)=>({key:nm,label:projects[i].title||nm,color:SERIES_VARS[i]}));
 if(names.length>6)series.push({key:"__other",label:"other",color:"--sx"});
 const known=new Set(names.slice(0,6)),rows=[],idx={};
 for(let i=0;i<n;i++){const row={t:end-(n-1-i)*b,by:{},err:0,blk:0,total:0};rows.push(row);idx[row.t]=row}
 points.forEach(p=>{const row=idx[p.t];if(!row)return;const k=known.has(p.project)?p.project:"__other";
  row.by[k]=(row.by[k]||0)+p.records/bucket;row.total+=p.records/bucket;row.err+=p.errors;row.blk+=p.blocked});
 return {rows,series,bucket,any:points.length>0};
}

function roundedTop(x,y,w,h,r){r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}

function drawChart(){
 const el=$("chart");if(!chartCache)return;
 const {rows,series,bucket,any}=chartCache;
 if(cview==="table"){drawTable(el,rows,series,bucket);return}
 const W=Math.max(300,el.clientWidth),L=54,R=8,T=10,PH=180,SH=8,GAP=14,B=24,pw=W-L-R,n=rows.length;
 const H=T+PH+GAP+SH+6+SH+B,slot=pw/n,bw=Math.min(24,Math.max(2,slot-2));
 const peak=Math.max(5,...rows.map(r=>r.total)),nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(peak))),f=peak/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})();
 const y=v=>T+PH-(v/nice)*PH,xc=i=>L+i*slot+slot/2;
 let g=`<svg viewBox="0 0 ${W} ${H}" height="${H}" tabindex="0" role="img" aria-label="Records per minute by project, ${esc(range)}. Peak ${compact(peak)} per minute. Use the Table view for exact values." id="svg">`;
 [0,.5,1].forEach(f=>{const v=nice*f,yy=Math.round(y(v))+.5;
  g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${f?"var(--line)":"var(--dim)"}" stroke-opacity="${f?1:.5}"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="var(--dim)" font-size="11">${compact(v)}</text>`});
 rows.forEach((row,i)=>{
  let cum=0,drawn=0;const x=xc(i)-bw/2,top=series.filter(s=>(row.by[s.key]||0)>0).pop();
  series.forEach(s=>{const v=row.by[s.key]||0;if(v<=0)return;
   const y0=y(cum),y1=y(cum+v),gapPx=drawn?2:0,h=Math.max(1,y0-y1-gapPx);cum+=v;drawn++;
   const fill=`var(${s.color})`,common=`fill="${fill}"`;
   g+=(s===top?`<path d="${roundedTop(x,y1,bw,h,4)}" ${common}/>`:`<rect x="${x}" y="${y1}" width="${bw}" height="${h}" ${common}/>`)});
  const ys=T+PH+GAP;
  if(row.err)g+=`<rect x="${x}" y="${ys}" width="${bw}" height="${SH}" rx="2" fill="var(--st-err)"/>`;
  if(row.blk)g+=`<rect x="${x}" y="${ys+SH+6}" width="${bw}" height="${SH}" rx="2" fill="var(--st-blk)"/>`});
 g+=`<text x="${L-8}" y="${T+PH+GAP+SH/2+3.5}" text-anchor="end" fill="var(--dim)" font-size="10">errors</text><text x="${L-8}" y="${T+PH+GAP+SH+6+SH/2+3.5}" text-anchor="end" fill="var(--dim)" font-size="10">blocked</text>`;
 const ticks=Math.min(6,Math.max(2,Math.floor(pw/120)));
 for(let k=0;k<ticks;k++){const i=Math.round(k*(n-1)/(ticks-1)),last=k===ticks-1;
  g+=`<text x="${xc(i)}" y="${H-6}" text-anchor="${k===0?"start":last?"end":"middle"}" fill="var(--dim)" font-size="11">${last?"now":clock(rows[i].t)}</text>`}
 if(!any)g+=`<text x="${L+pw/2}" y="${T+PH/2}" text-anchor="middle" fill="var(--dim)" font-size="12">No uploads in this range</text>`;
 g+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${T+PH+GAP+SH*2+6}" stroke="var(--dim)" visibility="hidden"/>`;
 g+=`<rect id="hit" x="${L}" y="${T}" width="${pw}" height="${H-T-B}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div>`;
 el.innerHTML=g;
 const svg=$("svg"),hit=$("hit");
 const pick=ev=>{const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*(W/r.width)-L;setHover(Math.max(0,Math.min(n-1,Math.floor(x/slot))),xc,L,W)};
 hit.addEventListener("pointermove",pick);hit.addEventListener("pointerdown",pick);
 hit.addEventListener("pointerleave",()=>setHover(null));
 svg.addEventListener("focus",()=>{if(hoverI==null)setHover(n-1,xc,L,W)});svg.addEventListener("blur",()=>setHover(null));
 svg.addEventListener("keydown",ev=>{const d={ArrowLeft:-1,ArrowRight:1}[ev.key];if(ev.key==="Escape")return setHover(null);
  if(d){ev.preventDefault();setHover(Math.max(0,Math.min(n-1,(hoverI??n-1)+d)),xc,L,W)}});
 if(hoverI!=null)setHover(Math.min(hoverI,n-1),xc,L,W);
}

function setHover(i,xc,L,W){
 hoverI=i;const xh=$("xh"),tip=$("tip");if(!xh||!tip||!chartCache)return;
 if(i==null){xh.setAttribute("visibility","hidden");tip.hidden=true;return}
 const {rows,series,bucket}=chartCache,row=rows[i],x=xc(i);
 xh.setAttribute("x1",x);xh.setAttribute("x2",x);xh.setAttribute("visibility","visible");
 tip.textContent="";
 const add=(cls,txt)=>{const d=document.createElement("div");d.className=cls;if(txt!=null)d.textContent=txt;tip.appendChild(d);return d};
 add("th",clock(row.t)+(bucket>1?" – "+clock(row.t+bucket*60):"")+" · records per minute");
 series.forEach(s=>{const v=row.by[s.key]||0,r=add("tr");
  const k=document.createElement("span");k.className="key";k.style.background=`var(${s.color})`;r.appendChild(k);
  const val=document.createElement("span");val.className="tv";val.textContent=(Math.round(v*10)/10).toString();r.appendChild(val);
  const nm=document.createElement("span");nm.className="tn";nm.textContent=s.label;r.appendChild(nm)});
 if(series.length>1){add("sep");const r=add("tr"),k=document.createElement("span");k.className="key";k.style.background="transparent";r.appendChild(k);
  const val=document.createElement("span");val.className="tv";val.textContent=(Math.round(row.total*10)/10).toString();r.appendChild(val);
  const nm=document.createElement("span");nm.className="tn";nm.textContent="total";r.appendChild(nm)}
 if(row.err||row.blk){add("sep");
  [["errors",row.err,"--st-err"],["blocked",row.blk,"--st-blk"]].forEach(([l,v,c])=>{if(!v)return;const r=add("tr"),k=document.createElement("span");k.className="key";k.style.background=`var(${c})`;r.appendChild(k);
   const val=document.createElement("span");val.className="tv";val.textContent=v;r.appendChild(val);const nm=document.createElement("span");nm.className="tn";nm.textContent=l;r.appendChild(nm)})}
 tip.hidden=false;
 const el=$("chart"),scale=el.clientWidth/W,px=x*scale,tw=tip.offsetWidth;
 tip.style.left=Math.max(0,Math.min(el.clientWidth-tw,px+14>el.clientWidth-tw?px-tw-14:px+14))+"px";tip.style.top="6px";
}

function drawTable(el,rows,series,bucket){
 const th=series.map(s=>`<th class="n">${esc(s.label)}/min</th>`).join("");
 const body=rows.slice().reverse().map(r=>`<tr><td>${clock(r.t)}</td>${series.map(s=>`<td class="n">${Math.round((r.by[s.key]||0)*10)/10}</td>`).join("")}<td class="n">${r.err||""}</td><td class="n">${r.blk||""}</td></tr>`).join("");
 el.innerHTML=`<div class="tblwrap"><table><tr><th>${bucket>1?bucket+"-min bucket from":"minute"}</th>${th}<th class="n">errors</th><th class="n">blocked</th></tr>${body}</table></div>`;
}

function drawLegend(ov){
 const L=$("legend");if(!chartCache||cview!=="chart"){L.innerHTML="";return}
 const {series}=chartCache;
 if(series.length<2){L.innerHTML=series.length?`<span class="dim">${esc(series[0].label)}</span>`:"";return}
 const now={};ov.projects.forEach(p=>now[p.project]=p.stats.rate_now);
 L.innerHTML=series.map(s=>`<span><i style="background:var(${s.color})"></i>${esc(s.label)} <em>${s.key in now?now[s.key].toFixed(0)+"/min now":""}</em></span>`).join("")+
  `<span><i style="background:var(--st-err);height:7px;width:12px"></i>minute had errors</span><span><i style="background:var(--st-blk);height:7px;width:12px"></i>minute had blocks</span>`;
}

function chart(points,bucket,ov){
 chartCache=buildChart(points,bucket,ov.projects);$("chart").classList.remove("stale");
 drawChart();drawLegend(ov);
}
function initChartControls(){
 $("ranges").innerHTML=Object.keys(RANGES).map(k=>`<button data-r="${k}" aria-pressed="${k===range}">${k}</button>`).join("");
 $("ranges").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b||b.dataset.r===range)return;range=b.dataset.r;
  document.querySelectorAll("#ranges button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.r===range));$("chart").classList.add("stale");hoverI=null;tick()});
 $("views").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;cview=b.dataset.v;
  document.querySelectorAll("#views button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===cview));drawChart();if(lastOv)drawLegend(lastOv)});
}
let lastOv=null;

function runnerRows(runs){
 if(!runs.length){$("runs").innerHTML='<div class="dim">No runners yet.</div>';return}
 $("runs").innerHTML=runs.slice(0,60).map(r=>{
  const st=r.stalled?"stalled":r.state,c=r.stalled||r.state==="failed"?"bad":r.state==="running"?"ok":"dim";
  const repo=r.repository.split("/").pop();
  const ip=esc(r.runner_ip)+(r.egress_ip&&r.egress_ip!==r.runner_ip?` / ${esc(r.egress_ip)}`:"");
  return `<div class="rn"><span class="st ${c}">${st}</span><span title="${esc(r.repository)} · ${esc(r.workflow)} #${esc(r.gh_run_id)}">${esc(repo)}<small> · ${esc(r.project)}</small></span>
  <span class="n">${r.job_index}/${r.total_jobs}</span><span class="what" title="${esc(r.note)}">${esc(r.note||"-")}</span>
  <span class="n">${fmt(r.records)}${r.errors?` <small class="warn">${r.errors}e</small>`:""}${r.blocked?` <small class="bad">${r.blocked}b</small>`:""}</span>
  <span class="ip" title="${ip}">${ip}</span><span class="n dim">${ago(r.last_seen)}</span></div>`}).join("")}

async function tick(){
 try{
  const [ov,runs,tp,ips]=await Promise.all([j("/api/overview"),j("/api/runs?limit=200"),j(`/api/throughput?minutes=${RANGES[range].min}&bucket=${RANGES[range].bucket}`),j("/api/ips")]);
  const v=$("verdict"),has=ov.projects.length;v.textContent=has?ov.verdict:"no data";v.className="pill "+(has?ov.verdict:"dim");
  kpis(ov);
  const det={};await Promise.all(ov.projects.map(async p=>{try{det[p.project]=await j("/api/projects/"+encodeURIComponent(p.project))}catch(e){}}));
  $("projects").innerHTML=ov.projects.map(p=>projectCard(p,runs.runs,det[p.project])).join("")||'<section class="dim">No projects have reported yet.</section>';
  lastOv=ov;chart(tp.points,tp.bucket||1,ov);runnerRows(runs.runs);
  $("repos").innerHTML=ov.repos.map(r=>`<div class="chip">${esc(r.repository)}<span class="tag" title="${r.auth_kind==="oidc"?"identity verified by GitHub":"self-reported by the caller"}">${r.auth_kind==="oidc"?"verified":"self-reported"}</span><br><small class="dim">${r.running} running · ${r.runs} runs · ${fmt(r.records)} records · ${ago(r.last_seen)} ago</small></div>`).join("")||'<span class="dim">none yet</span>';
  $("ips").innerHTML='<tr><th>seen by api</th><th>reported by runner</th><th class="n">runs</th><th class="n">records</th><th>last seen</th></tr>'+
   ips.ips.map(r=>`<tr><td>${esc(r.runner_ip)}</td><td>${esc(r.egress_ip||"-")}</td><td class="n">${r.runs}</td><td class="n">${fmt(r.records)}</td><td>${ago(r.last_seen)} ago</td></tr>`).join("");
  $("dot").className="live";$("updated").textContent="live · "+new Date().toLocaleTimeString();
 }catch(e){if(e!==0){$("dot").className="live off";$("updated").textContent="update failed, retrying"}}
}
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?openSet.add(k):openSet.delete(k)}},true);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-retry]");if(!b)return;b.disabled=true;b.textContent="Retrying...";
 try{await fetch("/api/projects/"+encodeURIComponent(b.dataset.retry)+"/retry-failed",{method:"POST"})}finally{tick()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{drawChart()},150)});
initChartControls();tick();setInterval(tick,3000);
</script></body></html>
