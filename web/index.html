<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Scrape hub</title><style>
:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--sx:#898781;--st-err:#ec835a;--st-blk:#d03b3b;--bg:#0b0f14;--panel:#111820;--panel2:#16202b;--line:#26323f;--text:#d5dde6;--dim:#7d8b99;--accent:#6cb6ff;--ok:#5fcf8a;--warn:#e8b44c;--bad:#ef6a6a;--bar:#1e2a37}
@media (prefers-color-scheme:light){:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--bg:#f3f5f8;--panel:#fff;--panel2:#f6f8fb;--line:#d3dae2;--text:#1d2630;--dim:#66727f;--accent:#1f6fc0;--ok:#2a9d5c;--warn:#b7791f;--bad:#cf3f3f;--bar:#e6ebf1}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
a{color:var(--accent)}.dim{color:var(--dim)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{font-size:14px;margin:0;letter-spacing:.08em}header .sp{flex:1}
.pill{padding:1px 10px;border-radius:99px;border:1px solid currentColor;font-size:12px;font-weight:600;white-space:nowrap}
.healthy{color:var(--ok)}.degraded{color:var(--warn)}.unhealthy{color:var(--bad)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2s infinite}
.live.off{background:var(--bad);animation:none}@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}
main{padding:16px;display:grid;gap:14px;max-width:1280px;margin:0 auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h2{font-size:11px;margin:0 0 10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.15;font-weight:700}.kpi span{color:var(--dim);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;display:flex;margin:10px 0 4px}
.bar i{display:block;height:100%}.done{background:var(--ok)}.claimed{background:var(--accent)}.failed{background:var(--bad)}.pending{background:transparent}
.rules{margin:10px 0 0;padding:0;list-style:none}.rules li{display:flex;gap:8px;padding:1px 0}
.rules li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:currentColor}
.rules span{color:var(--text)}
.slices{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tile{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0f14;background:var(--bar)}
.tile.running{background:var(--ok)}.tile.finished{background:var(--accent)}.tile.stalled{background:var(--bad)}.tile.failed{background:var(--bad)}.tile.none{color:var(--dim);border:1px dashed var(--line);background:transparent}
.prog{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}.prog b{font-size:15px}
.bar.big{height:10px}.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.m{border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--panel2);font-size:12px}.m i{font-style:normal;color:var(--dim)}
.tgt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.tgt .err{grid-column:1/-1;color:var(--bad);word-break:break-word}
a.act{display:inline-block;text-decoration:none;font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
a.act:hover{border-color:var(--accent)}
button.act{font:inherit;font-size:12px;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
button.act:hover{border-color:var(--accent)}
.pstats{display:flex;flex-wrap:wrap;gap:22px;margin:4px 0 12px}.pstats b{display:block;font-size:20px;line-height:1.2}.pstats span{color:var(--dim);font-size:12px}
.pax{font-size:10px;fill:var(--dim)}.pol{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.pol td,.pol th{padding:3px 12px 3px 0;text-align:left;border-top:1px solid var(--line);font-weight:400}.pol th{color:var(--dim);font-size:11px}
.sub{margin-top:10px}.sub summary{cursor:pointer;color:var(--dim);font-size:12px}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:3px 11px;border:0;background:transparent;color:var(--dim);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--panel2);color:var(--text);font-weight:700}
.seg button:hover{color:var(--text)}
.speed{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.speed .sr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.speed .sl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.speed .seg button.pause[aria-pressed=true]{background:var(--warn);color:#0b0f14}
.speed label{font-size:12px;color:var(--dim);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.speed .eff{margin-top:8px;font-size:12px;color:var(--dim)}.speed .eff b{color:var(--text)}
.speed .thr{margin-top:6px;font-size:12px;color:var(--warn)}
.chartwrap{position:relative;transition:opacity .15s}.chartwrap.stale{opacity:.45}svg{display:block;width:100%}
svg text{font-family:inherit}
.tip{position:absolute;pointer-events:none;z-index:4;min-width:150px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 18px rgba(0,0,0,.22);font-size:12px}
.tip .th{color:var(--dim);margin-bottom:4px}.tip .tr{display:flex;align-items:center;gap:8px;padding:1px 0}
.tip .key{flex:none;width:12px;height:3px;border-radius:2px}.tip .tv{font-weight:700;font-size:13px;min-width:40px;text-align:right}.tip .tn{color:var(--dim)}
.tip .sep{border-top:1px solid var(--line);margin:4px 0}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px}
.lg span{display:inline-flex;align-items:center;gap:6px;color:var(--text)}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}.lg em{font-style:normal;color:var(--dim)}
.tblwrap{max-height:300px;overflow:auto}.tblwrap table{margin-top:0}
.tblwrap th{position:sticky;top:0;background:var(--panel)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.grp{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden;background:var(--panel2)}
.grp:first-of-type{margin-top:0}
.gh{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;width:100%;text-align:left;font:inherit;color:var(--text);background:transparent;border:0;padding:10px 12px;cursor:pointer}
.gh:hover{background:var(--panel)}.gh .chev{color:var(--dim);width:12px;display:inline-block;transition:transform .15s}.grp.open .chev{transform:rotate(90deg)}
.gh b{font-weight:700}.gh .sm{color:var(--dim);font-size:12px}.gh .gs{margin-left:auto;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:12px}
.gp{height:3px;background:var(--bar);display:flex}.gp i{display:block;height:100%}.gp .f{background:var(--accent)}.gp .r{background:var(--ok)}.gp .x{background:var(--bad)}
.gb{display:none;padding:2px 12px 8px;background:var(--panel)}.grp.open .gb{display:block}
.rn,.rnh{display:grid;grid-template-columns:84px 54px minmax(0,1fr) 92px 112px 270px 46px;gap:4px 12px;align-items:center}
.rnh{color:var(--dim);font-size:11px;padding:8px 0 4px}.rnh .n{text-align:right}
.rn{padding:7px 0;border-top:1px solid var(--line);position:relative}.gb .rn:first-of-type{border-top:0}
.rn .st{font-weight:600;white-space:nowrap}.rn .what{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.rn small{color:var(--dim)}
.rn .ip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dim)}
.dot.running{background:var(--ok);animation:pulse 1.6s infinite}.dot.stalled,.dot.failed{background:var(--bad)}.dot.finished{background:var(--accent)}
.spark{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}.spark svg{width:56px;height:16px}
.badge{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);font-size:11px}
.bump{animation:bump 1.4s ease-out}@keyframes bump{from{background:color-mix(in srgb,var(--ok) 28%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.bump,.dot.running{animation:none}}
@media (max-width:860px){
 .rnh{display:none}
 .rn{grid-template-columns:auto auto 1fr auto;grid-template-areas:"st sl sl seen" "what what what what" "recs spark spark spark" "ip ip ip ip";gap:3px 10px;padding:9px 0}
 .rn>:nth-child(1){grid-area:st}.rn>:nth-child(2){grid-area:sl;text-align:left}.rn>:nth-child(3){grid-area:what;white-space:normal}
 .rn>:nth-child(4){grid-area:recs;text-align:left}.rn>:nth-child(5){grid-area:spark;justify-content:flex-start}
 .rn>:nth-child(6){grid-area:ip;color:var(--dim);white-space:normal}.rn>:nth-child(7){grid-area:seen;text-align:right}
 .gh .gs{margin-left:0;width:100%}
}
.hh,.hrow{display:grid;grid-template-columns:104px minmax(0,1.4fr) 140px 62px 56px 84px 88px 92px;gap:4px 12px;align-items:center}
.hh{color:var(--dim);font-size:11px;padding:0 4px 6px}.hh .n{text-align:right}
.hrow{padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}.hrow:hover{background:var(--panel2)}.hrow .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow small{color:var(--dim)}
.opill{display:inline-block;padding:0 9px;border-radius:99px;border:1px solid currentColor;font-size:11px;font-weight:600}
.opill.o-completed{color:var(--ok)}.opill.o-partial{color:var(--warn)}.opill.o-failed,.opill.o-stalled{color:var(--bad)}.opill.o-ongoing{color:var(--accent)}
.hdetail{padding:2px 8px 8px 20px;border-top:1px dashed var(--line);background:var(--panel2)}
.lastrun{margin-top:8px;font-size:12px;color:var(--dim)}
@media (max-width:860px){.hh{display:none}.hrow{grid-template-columns:1fr auto;grid-template-areas:"o st" "name name" "meta meta"}
 .hrow>:nth-child(1){grid-area:o}.hrow>:nth-child(2){grid-area:name;white-space:normal}.hrow>:nth-child(3){grid-area:st;text-align:right}
 .hrow>:nth-child(n+4){display:none}.hrow .meta{display:block!important;grid-area:meta;color:var(--dim);font-size:12px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--panel2)}
.tag{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
details summary{cursor:pointer;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
table{border-collapse:collapse;width:100%;margin-top:8px}th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--dim);font-weight:500}
td.n,th.n{text-align:right}.scroll{overflow-x:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<header><h1>SCRAPE HUB</h1><span id="verdict" class="pill dim">loading</span><span id="probes"></span><span class="sp"></span>
<span class="dim"><span id="dot" class="live"></span><span id="updated">connecting</span></span><a href="/logout">sign out</a></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="cards" id="projects"></div>
<section><h2>Records per minute</h2>
<div class="chartbar"><div class="seg" id="ranges" role="group" aria-label="time range"></div>
<div class="seg" id="views" role="group" aria-label="view"><button data-v="chart" aria-pressed="true">Chart</button><button data-v="table" aria-pressed="false">Table</button></div></div>
<div class="chartwrap" id="chart"></div><div class="lg" id="legend"></div></section>
<section id="portal" hidden><div class="row"><h2 style="margin:0" id="ptitle">Portal reachability</h2><div class="seg" id="pranges" role="group" aria-label="time range"></div></div>
<div class="pstats" id="pstats"></div><div class="chartwrap" id="pchart"></div><div id="pouts"></div></section>
<section><h2>Ongoing runs</h2><div id="runs"></div></section>
<section><h2>History</h2><div class="hh"><span>outcome</span><span>run</span><span>started</span><span class="n">took</span><span class="n">slices</span><span class="n">records</span><span class="n">err / blocked</span><span>IPs</span></div><div id="hist"></div><div id="more" style="margin-top:8px"></div></section>
<section><h2>Repositories</h2><div class="chips" id="repos"></div></section>
<section><details><summary>Runner IP history, 7 days</summary><div class="scroll"><table id="ips"></table></div></details></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString();
const ago=t=>{if(!t)return"-";const s=Math.max(0,(Date.now()-new Date(t))/1000);
 return s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+"m":s<172800?Math.round(s/3600)+"h":Math.round(s/86400)+"d"};
const dur=s=>s<90?s+"s":s<5400?Math.round(s/60)+"m":(s/3600).toFixed(1)+"h";
async function j(u){const r=await fetch(u);if(r.status===401){location="/login";throw 0}if(!r.ok)throw new Error(u);return r.json()}

function kpis(ov){
 const P=ov.projects,sum=f=>P.reduce((a,p)=>a+f(p),0);
 const rate=sum(p=>p.stats.rate_now),run=sum(p=>p.stats.running),stalled=sum(p=>p.stats.stalled),rec=sum(p=>p.records_total);
 let done=0,tot=0;P.forEach(p=>{const q=p.stats.queue||{};Object.values(q).forEach(n=>tot+=n);done+=q.done||0});
 $("kpis").innerHTML=
  `<div class="kpi"><b>${rate.toFixed(0)}</b><span>records / min</span></div>
   <div class="kpi"><b>${run}</b><span>runners active${stalled?` · <span class="bad">${stalled} stalled</span>`:""}</span></div>
   <div class="kpi"><b>${fmt(rec)}</b><span>records stored</span></div>
   <div class="kpi"><b>${tot?Math.round(done/tot*100)+"%":"-"}</b><span>${tot?`${fmt(done)} of ${fmt(tot)} orgs done`:"no queue"}</span></div>`}

function slicesFor(project,runs){
 const mine=runs.filter(r=>r.project===project);if(!mine.length)return"";
 const latest=mine[0],g=mine.filter(r=>r.repository===latest.repository&&r.gh_run_id===latest.gh_run_id&&r.run_attempt===latest.run_attempt);
 const by={};g.forEach(r=>by[r.job_index]=r);
 let t="";for(let i=0;i<Math.min(latest.total_jobs,60);i++){const r=by[i],st=r?(r.stalled?"stalled":r.state):"none";
  t+=`<span class="tile ${st}" title="slice ${i+1} of ${latest.total_jobs}: ${st}${r?`, ${fmt(r.records)} records`:" (not started)"}">${i+1}</span>`}
 return `<div class="slices" role="img" aria-label="runner slices for the latest workflow run">${t}</div>`}

const PRESETS=[["Slow",2,300],["Normal",4,0],["Fast",8,0],["Max",16,0],["Turbo",32,0]];
window.__det={};
function speedHtml(id,d){
 const sv=d.settings||{},ef=d.effective||sv,pid=esc(id);
 const btns=PRESETS.map(([n,t,dl])=>`<button data-speed="${t},${dl}" data-sp="${pid}" aria-pressed="${!sv.paused&&sv.threads===t&&sv.delay_ms===dl}" title="${t} threads per runner${dl?`, ${dl} ms between requests`:""}">${n} <small class="dim">${t}</small></button>`).join("");
 const eff=sv.paused?`<b class="warn">Paused</b>: runners finish what they hold and take no new work.`:
  `Runners are using <b>${ef.threads}</b> thread${ef.threads>1?"s":""} each${ef.delay_ms?` with <b>${ef.delay_ms} ms</b> between requests`:""}.`;
 const thr=ef.throttled?`<div class="thr">Auto-throttled: ${esc(ef.reason||"the target is pushing back")}. Saved speed is ${sv.threads} threads; it returns when things calm down.</div>`:"";
 return `<div class="speed"><div class="sr"><span class="sl">Speed</span><div class="seg" role="group" aria-label="runner speed">${btns}<button class="pause" data-pause="${pid}" aria-pressed="${!!sv.paused}">${sv.paused?"Resume":"Pause"}</button></div>
  <label title="When more than 10% of work is blocked, or eprocure sends several 429/403/503 responses, halve the threads and add a delay until it calms down."><input type="checkbox" data-auto="${pid}" ${sv.auto_backoff?"checked":""}> auto-backoff</label></div>
  <div class="eff">${eff} <span>Applies to every runner within about 30 seconds. Faster means more load on eprocure.</span></div>${thr}</div>`}
async function saveSpeed(id,patch){
 const sv=(window.__det[id]||{}).settings||{threads:4,delay_ms:0,paused:false,auto_backoff:true};
 const body={threads:sv.threads,delay_ms:sv.delay_ms,paused:sv.paused,auto_backoff:sv.auto_backoff,...patch};
 try{await fetch("/api/projects/"+encodeURIComponent(id)+"/settings",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})}finally{tick()}}
document.addEventListener("click",e=>{
 const sp=e.target.closest("[data-speed]");if(sp){const [t,dl]=sp.dataset.speed.split(",").map(Number);saveSpeed(sp.dataset.sp,{threads:t,delay_ms:dl,paused:false});return}
 const pz=e.target.closest("[data-pause]");if(pz){const id=pz.dataset.pause;saveSpeed(id,{paused:!((window.__det[id]||{}).settings||{}).paused})}});
document.addEventListener("change",e=>{const a=e.target.closest("[data-auto]");if(a)saveSpeed(a.dataset.auto,{auto_backoff:a.checked})});

const openSet=new Set();
const dur2=sec=>{if(sec==null)return null;const m=Math.round(sec/60);return m<90?m+"m":m<2880?(m/60).toFixed(1)+"h":(m/1440).toFixed(1)+"d"};
const tname=t=>t.payload&&(t.payload.org_name||t.payload.name)||t.key;
function metricChips(ms){
 const by={};ms.forEach(m=>by[m.name]=m);const used=new Set(),out=[];
 ms.forEach(m=>{if(m.name.endsWith("_ok")){const base=m.name.slice(0,-3),f=by[base+"_fail"];
   if(f){used.add(m.name);used.add(base+"_fail");const ok=m.hour,tot=ok+f.hour,r5=(m.last5||0),t5=r5+(f.last5||0);
    out.push(`<span class="m" title="${fmt(ok)} ok / ${fmt(f.hour)} failed in the last hour">${esc(base)} <b class="${ok/tot<.5?"warn":"ok"}">${Math.round(ok/tot*100)}%</b> <i>ok${t5?` · ${Math.round(r5/t5*100)}% last 5m`:""}</i></span>`)}}});
 ms.filter(m=>!used.has(m.name)).forEach(m=>out.push(`<span class="m">${esc(m.name)} <b>${fmt(m.hour)}</b> <i>1h</i></span>`));
 return out.length?`<div class="metrics">${out.join("")}</div>`:""}

function projectCard(p,runs,d){
 if(d)window.__det[p.project]=d;
 const q=p.stats.queue||{},tot=Object.values(q).reduce((a,b)=>a+b,0),ul=p.unit_label,rl=p.record_label;
 const exp=p.expected_records,have=p.records_total,pct=exp?Math.min(100,have/exp*100):null;
 const eta=p.eta_s!=null?"ETA "+dur2(p.eta_s):(p.stats.running?"ETA unknown":"idle");
 const bar=tot?`<div class="bar big" role="img" aria-label="${ul} progress">${["done","claimed","failed"].map(k=>`<i class="${k}" style="width:${(q[k]||0)/tot*100}%"></i>`).join("")}</div>
  <div class="dim">${fmt(q.done||0)} ${ul}s done · ${fmt(q.claimed||0)} in flight · ${fmt(q.failed||0)} failed · ${fmt(q.pending||0)} waiting</div>`:"";
 const prog=`<div class="prog"><span><b>${fmt(have)}</b>${exp?` of ~${fmt(exp)}`:""} ${esc(rl)}s${pct!=null?` <span class="dim">(${pct.toFixed(1)}%)</span>`:""}</span><span><b>${p.stats.rate_now.toFixed(0)}</b>/min · ${eta}</span></div>`;
 let tail="";
 if(d){

function buildChart(points,bucket,projects){

   fail:R.filter(r=>r.state==="failed").length,rec:R.reduce((a,r)=>a+r.records,0),rt:R.reduce((a,r)=>a+(r.state==="running"?r.rate_5m:0),0),
   ipx:R.filter(r=>r.ip_count>1).length,ips:new Set(R.map(r=>r.runner_ip)).size,seen:Math.max(...R.map(r=>+new Date(r.last_seen))),start:Math.min(...R.map(r=>+new Date(r.started_at)))});return g});
 list.sort((a,b)=>((b.run+b.stall>0)-(a.run+a.stall>0))||b.seen-a.seen);
 const live=list.filter(g=>g.run+g.stall>0);
 if(!live.length){$("runs").innerHTML=`<div class="dim">No runs in progress.${lastPast?` Last run ${esc(lastPast.outcome)} ${ago(lastPast.last_seen)} ago (${fmt(lastPast.records)} records, took ${dur(lastPast.duration_s)}).`:""}</div>`;return}
 $("runs").innerHTML=`<div class="rnh" style="padding-left:12px;padding-right:12px"><span>state</span><span class="n">slice</span><span>doing now</span><span class="n">records</span><span class="n">rate, 15 min</span><span>ip seen by hub</span><span class="n">heard</span></div>`+
  live.map(g=>{const f=g.f,total=Math.max(f.total_jobs,g.runs.length),active=true;
   const open=grpOpen.has(g.k)?grpOpen.get(g.k):active;
   const bar=`<div class="gp" role="img" aria-label="${g.fin} of ${total} slices finished"><i class="f" style="width:${g.fin/total*100}%"></i><i class="r" style="width:${g.run/total*100}%"></i><i class="x" style="width:${(g.stall+g.fail)/total*100}%"></i></div>`;
   const chips=[g.run?`<span class="ok">${g.run} running</span>`:"",g.stall?`<span class="bad">${g.stall} stalled</span>`:"",g.fin?`<span style="color:var(--accent)">${g.fin} finished</span>`:"",g.fail?`<span class="bad">${g.fail} failed</span>`:""].filter(Boolean).join(" · ");
   return `<div class="grp${open?" open":""}" data-g="${esc(g.k)}"><button class="gh" aria-expanded="${open}"><span class="chev">▸</span>
    <b>${esc(f.repository.split("/").pop())}</b><span class="sm">${esc(f.project)} · run ${esc(f.gh_run_id)}${f.run_attempt>1?"."+f.run_attempt:""}</span>
    <span class="gs"><span>${chips}</span><span><b>${fmt(g.rec)}</b> <span class="dim">records</span></span>${g.rt?`<span><b>${rate(g.rt)}</b><span class="dim">/min</span></span>`:""}
    <span class="dim" title="${g.ips} distinct addresses across ${g.runs.length} runners">${g.ips} IP${g.ips>1?"s":""}</span>${g.ipx?`<span class="badge" title="${g.ipx} runner(s) changed address mid-run">IP changed ×${g.ipx}</span>`:""}
    <span class="dim">started ${ago(g.start)} ago</span></span></button>${bar}
    <div class="gb">${g.runs.map(rowHtml).join("")}</div></div>`}).join("")}
document.addEventListener("click",e=>{const h=e.target.closest(".gh");if(!h)return;const g=h.closest(".grp"),k=g.dataset.g,open=!g.classList.contains("open");
 grpOpen.set(k,open);g.classList.toggle("open",open);h.setAttribute("aria-expanded",open)});


const histOpen=new Set(),histDetail=new Map();let histLimit=15,histTotal=0;
const wkey=r=>[r.project,r.repository,r.gh_run_id,r.run_attempt].join("|");
const when=t=>{const d=new Date(t),n=new Date(),hm=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 return d.toDateString()===n.toDateString()?"today "+hm:d.toLocaleDateString([],{month:"short",day:"numeric"})+" "+hm};
function histRows(list){
 if(!list.length){$("hist").innerHTML='<div class="dim">No finished runs yet.</div>';$("more").innerHTML="";return}
 $("hist").innerHTML=list.map(r=>{const k=wkey(r),open=histOpen.has(k),link=r.github_url?` <a href="${esc(r.github_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="open this run on GitHub">#${esc(r.gh_run_id)} ↗</a>`:` #${esc(r.gh_run_id)}`;
  const slices=`${r.finished+r.failed}/${Math.max(r.total_jobs,r.slices)}`;
  return `<div class="hrow" role="button" tabindex="0" aria-expanded="${open}" data-h="${esc(k)}"><span><span class="opill o-${r.outcome}">${r.outcome}</span></span>
   <span class="hname"><b>${esc(r.repository.split("/").pop())}</b> <small>${esc(r.project)}</small>${link}</span>
   <span class="dim" title="${esc(new Date(r.started_at).toLocaleString())}">${when(r.started_at)}</span><span class="n">${dur(r.duration_s)}</span>
   <span class="n" title="${r.finished} finished, ${r.failed} failed of ${Math.max(r.total_jobs,r.slices)} slices">${slices}</span><span class="n">${fmt(r.records)}</span>
   <span class="n">${r.errors||r.blocked?`<span class="${r.errors?"warn":""}">${r.errors}</span> / <span class="${r.blocked?"bad":""}">${r.blocked}</span>`:"-"}</span>
   <span class="dim">${r.ips} IP${r.ips===1?"":"s"}${r.ip_changed?` <span class="badge" title="${r.ip_changed} runner(s) changed address mid-run">changed</span>`:""}</span>
   <span class="meta" style="display:none">${fmt(r.records)} records · took ${dur(r.duration_s)} · ${slices} slices · ${r.ips} IP${r.ips===1?"":"s"}</span></div>
   <div class="hdetail" ${open?"":"hidden"}>${open?(histDetail.get(k)||'<span class="dim">loading…</span>'):""}</div>`}).join("");
 $("more").innerHTML=list.length>=histLimit?`<button class="act" id="moreBtn">Show more</button>`:"";
}
async function openHist(row){
 const k=row.dataset.h;if(histOpen.has(k)){histOpen.delete(k)}else{histOpen.add(k);
  const [project,repository,gh,att]=k.split("|");
  try{const d=await j(`/api/runs?project=${encodeURIComponent(project)}&repository=${encodeURIComponent(repository)}&gh_run_id=${encodeURIComponent(gh)}&attempt=${att}&limit=200`);
   histDetail.set(k,d.runs.sort((a,b)=>a.job_index-b.job_index).map(rowHtml).join(""))}catch(e){histDetail.set(k,'<span class="bad">could not load</span>')}}
 if(lastHist)histRows(lastHist);
}
let lastHist=null;
document.addEventListener("click",e=>{const b=e.target.closest("#moreBtn");if(b){histLimit+=30;tick();return}const r=e.target.closest(".hrow");if(r)openHist(r)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("hrow")){e.preventDefault();openHist(e.target)}});

async function tick(){
 try{
  const [ov,runs,tp,ips,past]=await Promise.all([j("/api/overview"),j("/api/runs?limit=200"),j(`/api/throughput?minutes=${RANGES[range].min}&bucket=${RANGES[range].bucket}`),j("/api/ips"),j(`/api/workflow-runs?state=past&limit=${histLimit}`)]);window.__past=past.runs;lastHist=past.runs;
  const v=$("verdict"),has=ov.projects.length;v.textContent=has?ov.verdict:"no data";v.className="pill "+(has?ov.verdict:"dim");
  kpis(ov);
  try{const pr=await j("/api/probes?minutes="+PR[prange].min);renderProbes(pr)}catch(e){}
  const det={};await Promise.all(ov.projects.map(async p=>{try{det[p.project]=await j("/api/projects/"+encodeURIComponent(p.project))}catch(e){}}));
  $("projects").innerHTML=ov.projects.map(p=>projectCard(p,runs.runs,det[p.project])).join("")||'<section class="dim">No projects have reported yet.</section>';
  lastOv=ov;chart(tp.points,tp.bucket||1,ov);runnerRows(runs.runs,past.runs[0]);histRows(past.runs);
  $("repos").innerHTML=ov.repos.map(r=>`<div class="chip">${esc(r.repository)}<span class="tag" title="${r.auth_kind==="oidc"?"identity verified by GitHub":"self-reported by the caller"}">${r.auth_kind==="oidc"?"verified":"self-reported"}</span><br><small class="dim">${r.running} running · ${r.runs} runs · ${fmt(r.records)} records · ${ago(r.last_seen)} ago</small></div>`).join("")||'<span class="dim">none yet</span>';
  $("ips").innerHTML='<tr><th>seen by api</th><th>reported by runner</th><th class="n">runs</th><th class="n">records</th><th>last seen</th></tr>'+
   ips.ips.map(r=>`<tr><td>${esc(r.runner_ip)}</td><td>${esc(r.egress_ip||"-")}</td><td class="n">${r.runs}</td><td class="n">${fmt(r.records)}</td><td>${ago(r.last_seen)} ago</td></tr>`).join("");
  $("dot").className="live";$("updated").textContent="live · "+new Date().toLocaleTimeString();
 }catch(e){if(e!==0){$("dot").className="live off";$("updated").textContent="update failed, retrying"}}
}
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?openSet.add(k):openSet.delete(k)}},true);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-retry]");if(!b)return;b.disabled=true;b.textContent="Retrying...";
 try{await fetch("/api/projects/"+encodeURIComponent(b.dataset.retry)+"/retry-failed",{method:"POST"})}finally{tick()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{drawChart()},150)});
initChartControls();tick();setInterval(tick,3000);
</script></body></html>
