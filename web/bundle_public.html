<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>__NAME__</title><style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#d3dae2;--text:#1d2630;--dim:#66727f;--accent:#1f6fc0;--bad:#cf3f3f}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--panel:#111820;--line:#26323f;--text:#d5dde6;--dim:#7d8b99;--accent:#6cb6ff;--bad:#ef6a6a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);
font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.kicker{margin:0 0 6px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0 0 4px;font:600 18px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;word-break:break-all}
.facts{margin:0 0 14px;color:var(--dim);font-size:13px}.note{margin:0 0 16px;white-space:pre-wrap}
label{display:block;font-size:13px;margin:0 0 6px}
input{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:9px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.err{color:var(--bad);margin:0 0 12px}.small{margin:14px 0 0;color:var(--dim);font-size:12px}
</style></head><body><main><p class="kicker">Tender bundle</p><h1>__NAME__</h1>
__BODY__
</main></body></html>
